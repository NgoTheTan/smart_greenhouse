# GreenHub - Mosquitto 2.x
# Xác thực/ACL: Dynamic Security plugin (spec 5). Cấm anonymous.
per_listener_settings false
allow_anonymous false

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Listener nội bộ mạng Docker (worker, api-admin). KHÔNG publish ra ngoài ở prod.
listener 1883

# Listener TLS cho gateway và simulator
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Giới hạn hợp lý cho thiết bị nhỏ
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 65536

