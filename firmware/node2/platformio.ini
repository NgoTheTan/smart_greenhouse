; GreenHub - Sensor Node 2 (ESP8266 NodeMCU v2 + Độ ẩm đất A0 + Wi-Fi UDP + ArduinoOTA)
; Build & Upload USB: pio run -e node2 -t upload
; Upload Wi-Fi OTA:   pio run -e node2_ota -t upload

[platformio]
default_envs = node2

[env:node2]
platform = espressif8266@^4.2.1
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
  gh_common
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DPIN_SOIL_AOUT=A0
  -DPIN_LED=2

[env:node2_ota]
extends = env:node2
upload_protocol = espota
upload_port = node2.local
