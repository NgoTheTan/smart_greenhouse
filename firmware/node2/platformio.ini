; GreenHub - Sensor Node 2 (ESP32-C3 Super Mini + Độ ẩm đất GPIO0 + Wi-Fi UDP + ArduinoOTA)
; Build & Upload USB: pio run -e node2 -t upload
; Upload Wi-Fi OTA:   pio run -e node2_ota -t upload

[platformio]
default_envs = node2

[env:node2]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
  gh_common
  bblanchon/ArduinoJson@^7.2.1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPIN_SOIL_AOUT=0
  -DPIN_LED=8

[env:node2_ota]
extends = env:node2
upload_protocol = espota
upload_port = node2.local
