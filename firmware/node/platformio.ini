; GreenHub - Sensor Node (ESP32 DevKit WROOM-32 & ESP8266)
; Build:  pio run -e node          (ESP32 thường, AHT20)
;         pio run -e node_demo     (ESP32 DEMO_MODE, AHT20, chu kỳ 10 s)
;         pio run -e node_sht30    (ESP32 dùng SHT30 thay AHT20 - điểm mở #1)
;         pio run -e node_dht11    (ESP32 DEMO_MODE dùng DHT11 + BH1750 + Soil)
;         pio run -e node_esp8266  (ESP8266 NodeMCU v2 chỉ gắn Soil v1.2)

[platformio]
default_envs = node_demo

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
  gh_common
  adafruit/Adafruit AHTX0@^2.0.5
  claws/BH1750@^1.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DPIN_I2C_SDA=21
  -DPIN_I2C_SCL=22
  -DPIN_SOIL_AOUT=34
  -DPIN_SOIL_VCC=25
  -DPIN_LED=2

[env:node]

[env:node_demo]
build_flags =
  ${env.build_flags}
  -DDEMO_MODE

[env:node_sht30]
lib_deps =
  gh_common
  adafruit/Adafruit SHT31 Library@^2.2.2
  claws/BH1750@^1.3.0
build_flags =
  ${env.build_flags}
  -DDEMO_MODE
  -DUSE_SHT30

[env:node_dht11]
lib_deps =
  gh_common
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  claws/BH1750@^1.3.0
build_flags =
  ${env.build_flags}
  -DDEMO_MODE
  -DUSE_DHT11
  -DPIN_DHT=4

[env:node_esp8266]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
  gh_common
build_flags =
  -DDEMO_MODE
  -DNO_AIR_SENSOR
  -DNO_LIGHT_SENSOR
  -DPIN_SOIL_AOUT=A0
  -DPIN_SOIL_VCC=14
  -DPIN_LED=2

