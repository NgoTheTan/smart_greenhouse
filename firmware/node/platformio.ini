; GreenHub - Sensor Node 1 (ESP32 + DHT11 GPIO26 + BH1750 I2C 21/22 + Soil GPIO34 + ST7789)
; Build & Upload: pio run -t upload

[platformio]
default_envs = node

[env:node]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
  gh_common
  bblanchon/ArduinoJson@^7.2.1
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  claws/BH1750@^1.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DPIN_DHT=26
  -DPIN_I2C_SDA=21
  -DPIN_I2C_SCL=22
  -DPIN_SOIL_AOUT=34
  -DPIN_LED=2
  -DPIN_TFT_SCLK=18
  -DPIN_TFT_MOSI=23
  -DPIN_TFT_RST=4
  -DPIN_TFT_DC=16
  -DPIN_TFT_CS=5
  -DPIN_TFT_BL=17

[env:node_ota]
extends = env:node
upload_protocol = espota
upload_port = node1.local
