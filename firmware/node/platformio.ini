; GreenHub - Sensor Node (ESP32 DevKit WROOM-32)
; Build:  pio run -e node          (chế độ thường, AHT20)
;         pio run -e node_demo     (DEMO_MODE, chu kỳ 10 s)
;         pio run -e node_sht30    (dùng SHT30 thay AHT20 - điểm mở #1)

[platformio]
default_envs = node_demo

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
  gh_common
  adafruit/Adafruit AHTX0@^2.0.5
  claws/BH1750@^1.3.0
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DPIN_I2C_SDA=21
  -DPIN_I2C_SCL=22
  -DPIN_SOIL_AOUT=34
  -DPIN_SOIL_VCC=25
  -DPIN_LED=2

[env:node]

[env:node_demo]
build_flags =
  ${env.build_flags}
  -DDEMO_MODE

[env:node_sht30]
lib_deps =
  gh_common
  adafruit/Adafruit SHT31 Library@^2.2.2
  claws/BH1750@^1.3.0
build_flags =
  ${env.build_flags}
  -DDEMO_MODE
  -DUSE_SHT30

