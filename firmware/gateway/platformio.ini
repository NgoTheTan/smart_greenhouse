; GreenHub - Gateway (ESP32 DevKit + relay 4 kênh kích mức thấp)
; Build:  pio run -e gateway

[platformio]
default_envs = gateway

[env:gateway]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFiManager + TLS khá lớn -> partition nhiều flash cho app
board_build.partitions = min_spiffs.csv
lib_extra_dirs = ../common
lib_deps =
  gh_common
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; payload cfg cần buffer lớn (Phụ lục A)
  -DMQTT_MAX_PACKET_SIZE=2048
  -DPIN_RELAY_PUMP1=25
  -DPIN_RELAY_PUMP2=26
  -DPIN_RELAY_FAN=27
  -DPIN_RELAY_MIST=33
  -DPIN_BUZZER=23
  -DPIN_LED=2
  -DMQTT_QUEUE_SIZE=150

